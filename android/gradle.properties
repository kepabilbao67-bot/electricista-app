# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx1536m
android.useAndroidX=true

# ---------------------------------------------------------------------------
# REQUISITO DE JDK: este proyecto necesita JDK 21.
#
# Capacitor 8 compila con sourceCompatibility/targetCompatibility 21 (ver
# android/app/capacitor.build.gradle), asi que un JDK 17 o anterior falla con
# "invalid source release: 21".
#
# A PROPOSITO no se fija aqui ninguna ruta absoluta de JDK: cada equipo tiene
# su JDK en una ubicacion distinta y una ruta fijada rompe el build en
# cualquier otro entorno. Gradle toma el JDK de JAVA_HOME (o del que tenga
# configurado el usuario en su GRADLE_USER_HOME/gradle.properties).
#
# Si tu JAVA_HOME no es 21, apuntalo a un JDK 21 o pasalo solo para esa
# ejecucion, sin tocar este fichero ni la configuracion global:
#   gradlew :app:assembleDebug -Dorg.gradle.java.home="<ruta-a-tu-jdk-21>"
# ---------------------------------------------------------------------------
