name: CI - Type Check & Lint

on:
  push:
    branches: [ "main", "master", "feat/**" ]
  pull_request:
    branches: [ "main", "master", "feat/**" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npx --no-install tsc --noEmit

      - name: Run Linter
        run: npm run lint

      - name: Verify Kepa CRM database isolation
        run: npx --no-install tsx --test src/lib/__tests__/kepa-db-isolation.test.ts

      - name: Verify central CRM configuration guard
        run: npx --no-install tsx --test src/lib/__tests__/central-crm-config.test.ts
