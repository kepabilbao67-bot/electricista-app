<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Icon container -->
  <rect x="6" y="6" width="48" height="48" rx="14" fill="url(#logo-grad)" filter="url(#glow)"/>
  
  <!-- Orbit 360 ring -->
  <circle cx="30" cy="30" r="17" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="4 2"/>
  
  <!-- Electric Bolt Icon -->
  <path d="M32 17L22 31H30L28 43L38 29H30L32 17Z" fill="url(#bolt-grad)" stroke="#FFFFFF" stroke-width="0.8" stroke-linejoin="round"/>
  
  <!-- Brand Text -->
  <text x="64" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Autónomo<tspan fill="#2563EB">360</tspan></text>
  <text x="64" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">GESTIÓN PROFESIONAL</text>
</svg>
