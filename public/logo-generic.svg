<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />

  <!-- Outer Isometric Gear Ring -->
  <g transform="translate(256, 256)">
    <!-- Tech Geometric Hexagon / Orbit -->
    <circle r="160" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-dasharray="24 16" opacity="0.6" />
    <circle r="128" fill="#1e293b" stroke="#3b82f6" stroke-width="4" opacity="0.8" />

    <!-- Abstract Central Core / Diamond Facets -->
    <path d="M 0 -100 L 75 -25 L 0 50 L -75 -25 Z" fill="url(#accentGrad)" filter="url(#glow)" />
    <path d="M 0 50 L 75 -25 L 0 100 L -75 -25 Z" fill="#1d4ed8" opacity="0.9" />

    <!-- Center Spark Energy Symbol -->
    <path d="M 8 -42 L -22 6 L 4 6 L -8 46 L 22 -2 L -4 -2 Z" fill="url(#sparkGrad)" />
  </g>
</svg>
